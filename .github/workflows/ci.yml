name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Base locale jetable : seules les clés générées par la CLI sont utilisées, aucun secret du dépôt.
      - run: supabase start
      - name: Variables de la base locale
        run: |
          supabase status -o env > /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SECRET_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
      # Clé du cookie signé du panier : jetable, tirée au hasard à chaque run (aucun secret dans le dépôt). Sans elle, tout ajout au panier échoue.
      - name: Secret jetable du panier
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "PANIER_COOKIE_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sql
      - run: npm run build
      # Statuts HTTP réels (404 des pages et fiches inconnues) sur le build de production servi par next start.
      - run: npm run test:e2e:prod
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Captures voulues par les e2e (test-results/captures/), publiées même quand tout passe, gardées 7 jours.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: test-results/captures/
          retention-days: 7
          if-no-files-found: ignore
      # Traces des e2e en échec (captures, contexte d'erreur), gardées 7 jours pour le diagnostic.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-e2e
          path: test-results/
          retention-days: 7
