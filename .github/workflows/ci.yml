name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Base locale jetable : seules les clés générées par la CLI sont utilisées, aucun secret du dépôt.
      - run: supabase start
      - name: Variables de la base locale
        run: |
          supabase status -o env > /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SECRET_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sql
      - run: npm run build
      # Statuts HTTP réels (404 des pages et fiches inconnues) sur le build de production servi par next start.
      - run: npm run test:e2e:prod
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
